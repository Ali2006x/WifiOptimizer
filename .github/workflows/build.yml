name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: List Files
        run: ls -la

      - name: Unzip Project
        run: |
          ls *.zip
          unzip -o *.zip

      - name: List After Unzip
        run: ls -la

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Find gradlew
        run: find . -name "gradlew"

      - name: Grant Permissions
        run: chmod +x WifiOptimizer/gradlew

      - name: Build APK
        run: |
          cd WifiOptimizer
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WifiOptimizer-APK
          path: WifiOptimizer/app/build/outputs/apk/debug/app-debug.apk
